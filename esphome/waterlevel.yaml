substitutions:
  name: "water-level-sensor"
  friendly_name: "Water Level Sensor"
  # Set your maximum tank depth / probe range in meters (e.g. 3.0m ~ 10ft):
  max_depth_meters: "2.0"
  # Set tank capacity in gallons:
  tank_capacity_gallons: "3000"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced: 
      sram1_as_iram: true    

# Enable Home Assistant native API
api:
  reboot_timeout: 0min
  # If you use an API encryption key in secrets.yaml, uncomment:
  encryption:
    key: "VSLwIK3rgy8HzK22qwazsLvocvx/II5CkJ4HZG+auxE="

web_server:
  port: 80
  version: 3

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Water-Level-Fallback"
    password: "fallbackpassword"

captive_portal:
  
# MQTT
mqtt:
  id: mqtt_client
  broker: mqtt.coffeys.net
  
logger:
  level: INFO

# SPI bus for TTGO T-Display onboard ST7789 TFT screen
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

# Global state for Screen Saver / Pixel Exerciser
globals:
  - id: screen_saver_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: screen_saver_phase
    type: int
    restore_value: no
    initial_value: '0'

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 20
  - file: "gfonts://Roboto"
    id: font_values
    size: 22
  - file: "gfonts://Roboto"
    id: font_sub
    size: 16

color:
  - id: color_white
    red: 100%
    green: 100%
    blue: 100%
  - id: color_cyan
    red: 0%
    green: 90%
    blue: 100%
  - id: color_green
    red: 20%
    green: 90%
    blue: 30%
  - id: color_dark_gray
    red: 20%
    green: 20%
    blue: 25%

display:
  - platform: st7789v
    id: tft_display
    model: "TTGO_TDISPLAY_135X240"
    backlight_pin: GPIO4
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO23
    rotation: 90
    lambda: |-
      // Screen Saver / Pixel Exerciser (exercises every subpixel to prevent burn-in)
      if (id(screen_saver_active)) {
        switch (id(screen_saver_phase)) {
          case 0:
            // Full White: 100% all subpixels on
            it.filled_rectangle(0, 0, 240, 135, Color(255, 255, 255));
            break;
          case 1:
            // Full Red: 100% red subpixels
            it.filled_rectangle(0, 0, 240, 135, Color(255, 0, 0));
            break;
          case 2:
            // Full Green: 100% green subpixels
            it.filled_rectangle(0, 0, 240, 135, Color(0, 255, 0));
            break;
          case 3:
            // Full Blue: 100% blue subpixels
            it.filled_rectangle(0, 0, 240, 135, Color(0, 0, 255));
            break;
          case 4:
            // Full Black: Relax all liquid crystal cells
            it.filled_rectangle(0, 0, 240, 135, Color(0, 0, 0));
            break;
        }
        return;
      }

      // Normal Dashboard Display:
      // Header banner
      it.rectangle(0, 0, 240, 26, id(color_dark_gray));
      it.print(120, 2, id(font_title), id(color_cyan), TextAlign::TOP_CENTER, "WATER TANK LEVEL");

      // Depth metric
      it.print(10, 34, id(font_sub), id(color_white), "Depth:");
      if (isnan(id(water_depth).state)) {
        it.print(100, 32, id(font_values), id(color_cyan), "-- m");
      } else {
        it.printf(100, 32, id(font_values), id(color_cyan), "%.2f m", id(water_depth).state);
      }

      // Percentage metric
      it.print(10, 62, id(font_sub), id(color_white), "Level:");
      if (isnan(id(water_percentage).state)) {
        it.print(100, 60, id(font_values), id(color_green), "-- %");
      } else {
        it.printf(100, 60, id(font_values), id(color_green), "%.1f %%", id(water_percentage).state);
      }

      // Volume metric (in Gallons)
      it.print(10, 90, id(font_sub), id(color_white), "Volume:");
      if (isnan(id(water_volume).state)) {
        it.print(100, 88, id(font_values), id(color_white), "-- gal");
      } else {
        it.printf(100, 88, id(font_values), id(color_white), "%.0f gal", id(water_volume).state);
      }

      // Progress bar at the bottom
      float pct = id(water_percentage).state;
      if (!isnan(pct)) {
        if (pct < 0.0) pct = 0.0;
        if (pct > 100.0) pct = 100.0;
        int bar_width = (int)((pct / 100.0) * 220.0);
        it.rectangle(9, 117, 222, 14, id(color_white));
        it.filled_rectangle(10, 118, bar_width, 12, id(color_green));
      }

# Script to cycle through full-screen pixel workout (30 seconds total)
script:
  - id: run_screen_saver
    mode: restart
    then:
      - lambda: |-
          id(screen_saver_active) = true;
          id(screen_saver_phase) = 0;
      - component.update: tft_display
      - delay: 5s
      - lambda: |-
          id(screen_saver_phase) = 1;
      - component.update: tft_display
      - delay: 5s
      - lambda: |-
          id(screen_saver_phase) = 2;
      - component.update: tft_display
      - delay: 5s
      - lambda: |-
          id(screen_saver_phase) = 3;
      - component.update: tft_display
      - delay: 5s
      - lambda: |-
          id(screen_saver_phase) = 4;
      - component.update: tft_display
      - delay: 5s
      - lambda: |-
          id(screen_saver_active) = false;
          id(screen_saver_phase) = 0;
      - component.update: tft_display

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago
    servers:
     - 0.pool.ntp.org
     - 1.pool.ntp.org
     - 2.pool.ntp.org
       
# Hourly interval timer
interval:
  - interval: 60min
    then:
      - if:
          condition:
            switch.is_on: screen_saver_schedule
          then:
            - script.execute: run_screen_saver

# Home Assistant switch to enable/disable the hourly routine
switch:
  - platform: template
    name: "${friendly_name} Screen Saver Schedule"
    id: screen_saver_schedule
    icon: "mdi:monitor-shimmer"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# Home Assistant button to trigger pixel workout on demand
button:
  - platform: template
    name: "${friendly_name} Exercise Screen"
    id: exercise_screen_button
    icon: "mdi:television-shimmer"
    on_press:
      - script.execute: run_screen_saver

sensor:
  # 1. Raw ADC reading from GPIO36 (VP pin on TTGO)
  - platform: adc
    pin: GPIO35
    name: "${friendly_name} Raw Voltage"
    id: raw_voltage
    attenuation: 12db
    update_interval: 20s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    internal: false
    filters:
      # Filter electrical ripple and water movement
      - median:
          window_size: 7
          send_every: 1
          send_first_at: 1
      - sliding_window_moving_average:
          window_size: 15
          send_every: 1

  # 2. Converted Water Depth in Meters
  - platform: copy
    source_id: raw_voltage
    name: "${friendly_name} Depth"
    id: water_depth
    unit_of_measurement: "m"
    device_class: distance
    state_class: measurement
    accuracy_decimals: 2
    filters:
      # Two-point linear calibration (adjust zero/max voltages during testing)
      - calibrate_linear:
          - 0.00 -> 0.00
          - 3.30 -> ${max_depth_meters}
      - lambda: |-
          if (x < 0.0) return 0.0;
          if (x > ${max_depth_meters}) return ${max_depth_meters};
          return x;

  # 3. Tank Level Percentage (0 - 100%)
  - platform: template
    name: "${friendly_name} Percentage"
    id: water_percentage
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      float depth = id(water_depth).state;
      if (isnan(depth)) return NAN;
      float pct = (depth / ${max_depth_meters}) * 100.0;
      if (pct < 0.0) return 0.0;
      if (pct > 100.0) return 100.0;
      return pct;

  # 4. Tank Volume in Gallons
  - platform: template
    name: "${friendly_name} Volume"
    id: water_volume
    unit_of_measurement: "gal"
    device_class: volume_storage
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      float pct = id(water_percentage).state;
      if (isnan(pct)) return NAN;
      return (pct / 100.0) * ${tank_capacity_gallons};

  # 1. Raw ADC reading from GPIO36 (VP pin on TTGO)
  - platform: adc
    pin: GPIO37
    name: "${friendly_name} Raw Voltage 37"
    id: raw_voltage37
    attenuation: 12db
    update_interval: 20s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    internal: false
    filters:
      # Filter electrical ripple and water movement
      - median:
          window_size: 7
          send_every: 1
          send_first_at: 1
      - sliding_window_moving_average:
          window_size: 15
          send_every: 1  
  - platform: adc
    pin: GPIO36
    name: "${friendly_name} Raw Voltage 36"
    id: raw_voltage36
    attenuation: 12db
    update_interval: 20s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    internal: false
    filters:
      # Filter electrical ripple and water movement
      - median:
          window_size: 7
          send_every: 1
          send_first_at: 1
      - sliding_window_moving_average:
          window_size: 15
          send_every: 1            

      
